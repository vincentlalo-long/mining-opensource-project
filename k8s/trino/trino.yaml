apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: gh
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://trino:8080
    query.max-memory=512MB
    query.max-memory-per-node=256MB
  jvm.config: |
    -server
    -Xmx1G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+ExitOnOutOfMemoryError
  node.properties: |
    node.environment=development
    node.id=trino-1
    node.data-dir=/data/trino
  tpch.properties: |
    connector.name=tpch
  iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=jdbc
    iceberg.jdbc-catalog.catalog-name=gh_ecosystem
    iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
    iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
    iceberg.jdbc-catalog.connection-user=${ENV:ICEBERG_JDBC_USER}
    iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_JDBC_PASSWORD}
    iceberg.jdbc-catalog.default-warehouse-dir=s3://bronze/warehouse
    fs.s3.enabled=true
    s3.endpoint=http://minio:9000
    s3.region=us-east-1
    s3.path-style-access=true
    s3.aws-access-key=${ENV:MINIO_ROOT_USER}
    s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: gh
  labels:
    app: trino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino
  template:
    metadata:
      labels:
        app: trino
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: trino
          image: trinodb/trino:484
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ICEBERG_JDBC_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: ICEBERG_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: config
              mountPath: /etc/trino/catalog/tpch.properties
              subPath: tpch.properties
            - name: config
              mountPath: /etc/trino/catalog/iceberg.properties
              subPath: iceberg.properties
            - name: data
              mountPath: /data/trino
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: trino-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: gh
spec:
  selector:
    app: trino
  ports:
    - name: http
      port: 8080
      targetPort: http
