apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-data
  namespace: gh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: gh
  labels:
    app: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init
          image: apache/superset:4.1.2
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              superset db upgrade
              superset fab create-admin \
                --username admin \
                --firstname Admin \
                --lastname User \
                --email admin@example.com \
                --password "$SUPERSET_ADMIN_PASSWORD" || true
              superset init
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-secret
                  key: SUPERSET_SECRET_KEY
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superset-secret
                  key: SUPERSET_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /app/superset_home
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      containers:
        - name: superset
          image: apache/superset:4.1.2
          env:
            - name: SUPERSET_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superset-secret
                  key: SUPERSET_SECRET_KEY
            - name: SUPERSET_PORT
              value: "8088"
          ports:
            - name: http
              containerPort: 8088
          volumeMounts:
            - name: data
              mountPath: /app/superset_home
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: superset-data
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: gh
spec:
  selector:
    app: superset
  ports:
    - name: http
      port: 8088
      targetPort: http
