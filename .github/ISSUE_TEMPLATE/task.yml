name: Task
description: A deliverable with an executable acceptance criterion
title: "[area] "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        One issue = one driver + one demoable outcome. Use checklists for small steps.
        Report writing and rubric evidence are shared team work, not a per-owner assignment.
  - type: input
    id: driver
    attributes:
      label: Driver
      description: One person accountable for closing this issue (A, B or C).
      placeholder: A / B / C
    validations:
      required: true
  - type: input
    id: contributors
    attributes:
      label: Contributors
      description: Other people contributing. Do not assign them in GitHub; list them here.
      placeholder: A, C
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this issue produce?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope (in / out)
      description: Explicitly list what is in scope and what is not.
      value: |
        In:
        - ...
        Out:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Executable checks, not prose.
      value: |
        - [ ] Command:
        - [ ] Artifact / CSV row:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paths, commands, CSV rows, screenshots or links that prove completion.
  - type: input
    id: blocked
    attributes:
      label: Blocked by
      description: Issue numbers or external dependencies.
  - type: textarea
    id: followups
    attributes:
      label: Follow-ups
      description: Work explicitly left out of this issue.
